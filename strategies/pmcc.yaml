# Poor man's covered call: a diagonal with a deep ITM long call standing in
# for the shares.
id: pmcc
label: Poor man's covered call (diagonal)
family: bullish income
description: Buy a deep ITM ~90-DTE call, sell a ~30-DTE OTM call against it. A covered call for a fraction of the capital.
margin_class: defined_risk
event_policy_as: covered_call
expirations:
  front: {dte_target: 30, tolerance: 10}
  back: {dte_target: 90, tolerance: 30}
legs:
  - {name: long_call, type: call, side: long, expiration: back, select: {delta: 0.80}}
  - {name: short_call, type: call, side: short, expiration: front, select: {delta: 0.30}}
entry:
  iv_regime: [low, mid]
  trend: [uptrend]
  earnings: block
exit:
  profit_target_pct: 50
  loss_stop_multiple: 0.5
notes:
  - MODEL RISK. The long call is valued at the front expiry by Black-Scholes at its entry IV.
  - The deep ITM long call often sits outside the default chain strike window; widen chain_capture.call_window_em or the resolver reports no strike.
