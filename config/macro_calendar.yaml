# Macro event calendar -- maintained by hand (Phase 9).
#
# Read by data_sources/events.py into the `events` table (symbol "*").
# What each event does to a trade is set in config.yaml -> event_policy.
#
# Sources, verified 2026-09-27:
#   FOMC  https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#         ("Each meeting date is tentative until confirmed at the meeting
#          immediately preceding it.")  date = the decision (second) day,
#         statement 14:00 ET.  sep: true = Summary of Economic Projections.
#   CPI   https://www.bls.gov/schedule/news_release/cpi.htm       08:30 ET
#   NFP   https://www.bls.gov/schedule/news_release/empsit.htm    08:30 ET
#         BLS had not published 2027 dates yet -- ADD THEM when it does.
#
# Add a row: {date: YYYY-MM-DD, note: "..."}; optional time: "HH:MM".

